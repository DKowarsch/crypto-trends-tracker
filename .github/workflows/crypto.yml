name: Crypto Data Fetcher
on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ADD THIS LINE
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}  # ADD THIS LINE
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: pip install requests pandas
      
    - name: Run script
      run: python crypto_fetch.py
      
    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add crypto_data.json crypto_data.csv
        git commit -m "Update crypto data - $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
        git push
