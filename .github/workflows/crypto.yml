name: Crypto Data Fetcher
on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours at minute 0
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'  # Use 3.12 for pandas compatibility
    - run: pip install requests pandas
    - run: python crypto_fetch.py
    - run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add crypto_data.json crypto_data.csv
        git commit -m "Update" || echo "No changes"
        git push
