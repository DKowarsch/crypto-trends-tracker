<!DOCTYPE html>
<html>
<head>
    <title>Crypto Trends Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; border: 1px solid #ddd; }
        th { background: #f5f5f5; }
        .positive { color: green; }
        .negative { color: red; }
    </style>
</head>
<body>
    <h1>Crypto Trends Dashboard</h1>
    <p>Auto-updated every 4 hours</p>
    <div id="lastUpdate">Loading...</div>
    <table id="coinsTable">
        <thead>
            <tr>
                <th>Rank</th>
                <th>Name</th>
                <th>Price</th>
                <th>24h Change</th>
                <th>Market Cap</th>
            </tr>
        </thead>
        <tbody>
            <!-- Data loads here -->
        </tbody>
    </table>

    <script>
        // Load data from your JSON file
        async function loadData() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/DKowarsch/crypto-trends-tracker/main/crypto_data.json');
                const coins = await response.json();
                displayData(coins);
            } catch (error) {
                document.getElementById('coinsTable').innerHTML = 
                    '<tr><td colspan="5">Loading data...</td></tr>';
            }
        }
        
        function displayData(coins) {
            let html = '';
            coins.forEach(coin => {
                const changeClass = coin['24h_change'] >= 0 ? 'positive' : 'negative';
                html += `
                    <tr>
                        <td>${coin.market_cap_rank}</td>
                        <td>${coin.name} (${coin.symbol})</td>
                        <td>$${coin.price.toFixed(4)}</td>
                        <td class="${changeClass}">${coin['24h_change'].toFixed(2)}%</td>
                        <td>$${parseInt(coin.market_cap).toLocaleString()}</td>
                    </tr>
                `;
            });
            
            document.querySelector('#coinsTable tbody').innerHTML = html;
            
            // Update timestamp
            if (coins.length > 0) {
                const lastUpdate = new Date(coins[0].timestamp);
                document.getElementById('lastUpdate').textContent = 
                    `Last updated: ${lastUpdate.toLocaleString()}`;
            }
        }
        
        // Load on page open
        loadData();
    </script>
</body>
</html>
